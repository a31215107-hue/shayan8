<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه ساده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .wheel-wrapper {
            position: relative;
            margin: 0 auto 30px;
        }

        .wheel {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 8px solid #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel-section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: right bottom;
        }

        .section-1 {
            background: #ff6b6b;
            transform: rotate(0deg);
        }

        .section-2 {
            background: #4ecdc4;
            transform: rotate(45deg);
        }

        .section-3 {
            background: #45b7d1;
            transform: rotate(90deg);
        }

        .section-4 {
            background: #96ceb4;
            transform: rotate(135deg);
        }

        .section-5 {
            background: #feca57;
            transform: rotate(180deg);
        }

        .section-6 {
            background: #ff9ff3;
            transform: rotate(225deg);
        }

        .section-7 {
            background: #54a0ff;
            transform: rotate(270deg);
        }

        .section-8 {
            background: #5f27cd;
            transform: rotate(315deg);
        }

        .wheel-text {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #fff;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .spin-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .spin-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .spin-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 30px;
        }

        .result.show {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .wheel {
                width: 250px;
                height: 250px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>گردونه ساده</h1>
        
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-section section-1">
                    <div class="wheel-text">جایزه<br>۱</div>
                </div>
                <div class="wheel-section section-2">
                    <div class="wheel-text">جایزه<br>۲</div>
                </div>
                <div class="wheel-section section-3">
                    <div class="wheel-text">جایزه<br>۳</div>
                </div>
                <div class="wheel-section section-4">
                    <div class="wheel-text">جایزه<br>۴</div>
                </div>
                <div class="wheel-section section-5">
                    <div class="wheel-text">جایزه<br>۵</div>
                </div>
                <div class="wheel-section section-6">
                    <div class="wheel-text">جایزه<br>۶</div>
                </div>
                <div class="wheel-section section-7">
                    <div class="wheel-text">جایزه<br>۷</div>
                </div>
                <div class="wheel-section section-8">
                    <div class="wheel-text">جایزه<br>۸</div>
                </div>
            </div>
        </div>

        <button class="spin-btn" id="spinBtn">بزن گردونه!</button>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const result = document.getElementById('result');
        
        const prizes = [
            'جایزه ۱ - تبریک!',
            'جایزه 2 - شانس با تو!',
            'جایزه 3 - عالی بودی!',
            'جایزه 4 - باز هم تلاش کن!',
            'جایزه 5 - برنده شدی!',
            'جایزه 6 - فوق العاده!',
            'جایزه 7 - بخت با تو بود!',
            'جایزه 8 - خوش شانسی!'
        ];
        
        let isSpinning = false;
        
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            result.textContent = '';
            result.classList.remove('show');
            
            const randomRotation = Math.floor(Math.random() * 360) + 1440; // 4 full rotations + random
            wheel.style.transform = `rotate(${randomRotation}deg)`;
            
            setTimeout(() => {
                const normalizedRotation = randomRotation % 360;
                const sectionAngle = 360 / 8;
                const winningSection = Math.floor((360 - normalizedRotation) / sectionAngle);
                
                result.textContent = prizes[winningSection];
                result.classList.add('show');
                
                isSpinning = false;
                spinBtn.disabled = false;
            }, 4000);
        });
    </script>
</body>
</html>
